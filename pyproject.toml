[project]
name = "parkos-harness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]
data = ["pandas>=2,<3", "numpy>=1.26,<3"]   # MLE track only

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["problem/tests", "harness/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
